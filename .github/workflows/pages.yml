name: update-and-deploy
on:
  push: {branches: [main]}
  schedule: [{cron: "30 0 * * 1"}]   # Mondays 06:00 IST
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/update.py
      - run: |
          git config user.name "kbc-bot"; git config user.email "kbc-bot@users.noreply.github.com"
          git add data && git commit -m "data: weekly re-check" || true
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
